name: Test semver range version spec
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          bazelisk-version: '>=1.20.0 <2.0.0'
      - name: Assert installed version satisfies the range
        run: |
          BIN="$(command -v bazel || true)"
          echo "bazel path: $BIN"
          if [ -z "$BIN" ] || [ ! -x "$BIN" ]; then
            echo "FAIL: bazel not found or not executable"
            exit 1
          fi
          VER="$(echo "$BIN" | sed -n 's#.*/bazelisk/\([0-9][0-9.]*\)/.*#\1#p')"
          echo "installed version: $VER"
          if [ -z "$VER" ]; then
            echo "FAIL: could not determine installed version from path"
            exit 1
          fi
          MAJOR="$(echo "$VER" | cut -d. -f1)"
          MINOR="$(echo "$VER" | cut -d. -f2)"
          if [ "$MAJOR" != "1" ] || [ "$MINOR" -lt 20 ]; then
            echo "FAIL: version $VER does not satisfy '>=1.20.0 <2.0.0'"
            exit 1
          fi
          echo "PASS"
